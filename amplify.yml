version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "Fixing metadata syntax errors with apostrophes..."
        # Fix the specific files with apostrophe issues
        # Replace all single quotes with double quotes in metadata objects
        - |
          find src/app -type f -name "*.tsx" -exec grep -l "export const metadata" {} \; | while read file; do
            echo "Checking $file..."
            # Replace single quotes with double quotes in entire metadata object
            sed -i "/export const metadata = {/,/^};/s/title: '/title: \"/g" "$file"
            sed -i "/export const metadata = {/,/^};/s/',$/\",/g" "$file"
            sed -i "/export const metadata = {/,/^};/s/description: '/description: \"/g" "$file"
            sed -i "/export const metadata = {/,/^};/s/' },$/\" },/g" "$file"
          done
        - echo "✓ Metadata syntax fixed"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "Fixing metadata syntax errors with apostrophes..."
        # Fix apostrophe issues in metadata objects
        # This converts single quotes to double quotes in title and description fields
        - find src -name "*.tsx" -o -name "*.ts" | xargs sed -i "s/title: '\\([^']*\\)'s/title: \"\\1's/g" 2>/dev/null || true
        - find src -name "*.tsx" -o -name "*.ts" | xargs sed -i "s/description: '\\([^']*\\)'s/description: \"\\1's/g" 2>/dev/null || true
        - find src -name "*.tsx" -o -name "*.ts" | xargs sed -i "s/title: '\\([^']*\\)Paul's/title: \"\\1Paul's/g" 2>/dev/null || true
        - echo "✓ Metadata syntax fixed"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
